<text x="28.0" y="520.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Snowflake Marketplace sitemap, 41 snapshots via the Internet Archive plus one live capture. THE TREND RUNS AGAINST ITS OWN BIAS:</text>
<text x="28.0" y="533.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">2023 is the sparsest year sampled (38-day median gaps against 29 in 2025), and sparse sampling MISSES short-lived listings entirely,</text>
<text x="28.0" y="546.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">which inflates that year's survival. The real gap is therefore wider than drawn, not narrower.</text>
